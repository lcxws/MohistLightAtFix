# @插件配置文件

# 是否启用插件
enabled: true

# 被@时弹出的标题文字（支持 & 颜色代码）
title:
  # 主标题
  text: "&e&l你被 @ 了！"
  # 副标题格式（%s 会被替换为发送者名字）
  subtitle-format: "&f来自 &b%s &f的消息"

# 聊天相关设置
chat:
  # 是否高亮显示消息中的 @用户名
  highlight: true
  # 高亮颜色
  highlight-color: "&e"
  # 被@者收到的私聊提醒
  notify-message: "&e[!] &b%s &e在聊天中@了你！"
  # @者发送成功提醒
  sender-message: "&a✓ 已成功@ %s"

# 音效设置（被@者会听到声音）
sound:
  enabled: false
  sound: "entity.experience_orb.pickup"
  volume: 1.0
  pitch: 1.0

# 是否在控制台记录@事件
log-to-console: true
