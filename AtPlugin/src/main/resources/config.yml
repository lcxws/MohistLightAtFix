# @插件配置文件

# 是否启用插件
enabled: true

# 冷却时间（秒）：同一玩家两次 @ 之间的最短间隔，防刷屏
cooldown-seconds: 3

# 被@时弹出的标题文字（支持 & 颜色代码）
title:
  # 主标题
  text: "&e&l你被 @ 了！"
  # 副标题格式（%s 会被替换为发送者名字）
  subtitle-format: "&f来自 &b%s &f的消息"

# 聊天相关设置
chat:
  # 被@者收到的私聊提醒（%s = 发送者名字）
  notify-message: "&e[!] &b%s &e@了你！"
  # 带消息时的私聊格式（%s = 发送者名字，%m = 消息内容）
  at-message: "&e[@] &b%s&7: &f%m"
  # @者发送成功提醒（%s = 被@玩家名字）
  sender-message: "&a✓ 已 @ %s"

# 音效设置（被@者会听到声音）
sound:
  enabled: false
  sound: "entity.experience_orb.pickup"
  volume: 1.0
  pitch: 1.0

# 是否在控制台记录@事件
log-to-console: true
